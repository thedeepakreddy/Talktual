<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talktual</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved appearance before first paint (no flash). Display preference only.
      try {
        var t = localStorage.getItem('talktual.theme.v1');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
