[package]
name = "talktual-bridge"
description = "Local WebSocket bridge: Talktual (browser) microphone audio -> Communication Engine recognition (sherpa-onnx) -> transcript revisions."
version = "0.1.0"
edition = "2024"
# Depends on ce-asr-sherpa (Rust 1.89, native libraries); outside the CE
# workspace for the same reasons (ADR-0023, ADR-0024).
rust-version = "1.89"
license = "UNLICENSED"
publish = false
repository = "https://github.com/thedeepakreddy/Talktual"

[workspace]

[dependencies]
ce-core = { path = "../../crates/ce-core" }
ce-audio = { path = "../../crates/ce-audio" }
ce-speech = { path = "../../crates/ce-speech" }
communication-engine = { path = "../../crates/communication-engine" }
ce-asr-sherpa = { path = "../ce-asr-sherpa" }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"

[dev-dependencies]
ce-audio-intel = { path = "../../crates/ce-audio-intel" }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"