[package]
name = "communication-engine"
description = "Communication Engine runtime and public facade (provisional API)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# Forward redacted observations to the `tracing` ecosystem.
tracing = ["dep:tracing"]
# The cpal audio backend adapter (needs libasound2-dev on Linux).
cpal = ["ce-audio/cpal"]

[dependencies]
ce-core = { workspace = true }
ce-audio = { workspace = true }
ce-audio-intel = { workspace = true }
ce-speech = { workspace = true }
ce-semantic = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
ce-testkit = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[[example]]
name = "runtime_smoke"

[lints]
workspace = true

[[example]]
name = "audio_smoke"

[[example]]
name = "audio_probe"

