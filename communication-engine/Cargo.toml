[workspace]
resolver = "3"
members = ["crates/ce-core", "crates/ce-audio", "crates/ce-audio-intel", "crates/ce-speech", "crates/ce-semantic", "crates/communication-engine", "crates/ce-testkit"]
# Optional, separately built adapters (native dependencies, own MSRV).
exclude = ["adapters/ce-asr-sherpa", "adapters/talktual-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
repository = "https://github.com/thedeepakreddy/Talktual"

[workspace.dependencies]
ce-core = { path = "crates/ce-core", version = "0.1.0" }
communication-engine = { path = "crates/communication-engine", version = "0.1.0" }
ce-testkit = { path = "crates/ce-testkit", version = "0.1.0" }
ce-audio = { path = "crates/ce-audio", version = "0.1.0" }
ce-audio-intel = { path = "crates/ce-audio-intel", version = "0.1.0" }
ce-speech = { path = "crates/ce-speech", version = "0.1.0" }
ce-semantic = { path = "crates/ce-semantic", version = "0.1.0" }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
semver = { version = "1.0.23", features = ["serde"] }
uuid = { version = "1.10", default-features = false, features = ["serde", "std"] }
tokio = { version = "1.40", default-features = false }
tokio-util = { version = "0.7.12", default-features = false }
tracing = { version = "0.1.40", default-features = false, features = ["std"] }
rtrb = "0.4.1"
cpal = { version = "0.18.2", default-features = false }
# Text language identification (Phase 4, ADR-0020): MIT, no dependencies.
whichlang = "0.1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
await_holding_lock = "deny"
large_futures = "warn"

[profile.dev]
debug = 1
