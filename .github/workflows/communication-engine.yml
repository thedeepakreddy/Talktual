name: communication-engine

# Runs only when the Rust Communication Engine (or this workflow) changes, so
# the existing Talktual web/server pipeline is unaffected.
on:
  push:
    paths: ["communication-engine/**", ".github/workflows/communication-engine.yml"]
  pull_request:
    paths: ["communication-engine/**", ".github/workflows/communication-engine.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: communication-engine

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain and check targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-linux-android x86_64-pc-windows-msvc aarch64-apple-darwin wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: communication-engine
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Verification gates
        run: scripts/verify.sh

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check declared MSRV (1.85)
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets --all-features
